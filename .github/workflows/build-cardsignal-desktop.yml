name: Build CardSignal Desktop

on:
  push:
    branches: [cardsignal-desktop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_DIR: source/CardSignal-Desktop-v0.5.0-upload
    steps:
      - name: Check out bootstrap files
        uses: actions/checkout@v4

      - name: Restore CardSignal source bundle
        shell: pwsh
        run: |
          $parts = Get-ChildItem cardsignal-source.part* | Sort-Object Name
          if (-not $parts) { throw 'CardSignal source parts were not found.' }
          $encoded = ($parts | ForEach-Object { Get-Content $_.FullName -Raw }) -join ''
          [IO.File]::WriteAllBytes('cardsignal-source.tar.gz', [Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force -Path source | Out-Null
          tar -xzf cardsignal-source.tar.gz -C source
          if (-not (Test-Path "$env:SOURCE_DIR/package.json")) {
            Get-ChildItem source -Recurse | Select-Object FullName
            throw "package.json was not restored at $env:SOURCE_DIR"
          }

          $backendPath = "$env:SOURCE_DIR/src-tauri/src/lib.rs"
          $backend = [IO.File]::ReadAllText($backendPath)
          $backend = $backend.Replace(
            'use reqwest::header::{ACCEPT, ACCEPT_LANGUAGE, AUTHORIZATION, USER_AGENT};',
            'use reqwest::header::{ACCEPT, ACCEPT_LANGUAGE, AUTHORIZATION};'
          )
          $backend = $backend.Replace(
            '        let mut backup = rusqlite::backup::Backup::new(&source, &mut target)?;',
            '        let backup = rusqlite::backup::Backup::new(&source, &mut target)?;'
          )
          $oldBlock = @'
        let document = Html::parse_document(&html);
        let base = Url::parse(&article_url)?;
        let mut candidates = Vec::<String>::new();
        let mut seen_links = HashSet::<String>::new();
        for anchor in document.select(&href_selector) {
            let Some(href) = anchor.value().attr("href") else { continue; };
            let resolved = Url::parse(href).or_else(|_| base.join(href));
            let Ok(url) = resolved else { continue; };
            let text = url.as_str().to_string();
            let lower = text.to_lowercase();
            if (lower.contains("bit.ly/") || lower.contains(".csv") || lower.contains("hubspotusercontent"))
                && seen_links.insert(text.clone())
            {
                candidates.push(text);
            }
        }
'@
          $newBlock = @'
        let candidates = {
            let document = Html::parse_document(&html);
            let base = Url::parse(&article_url)?;
            let mut candidates = Vec::<String>::new();
            let mut seen_links = HashSet::<String>::new();
            for anchor in document.select(&href_selector) {
                let Some(href) = anchor.value().attr("href") else { continue; };
                let resolved = Url::parse(href).or_else(|_| base.join(href));
                let Ok(url) = resolved else { continue; };
                let text = url.as_str().to_string();
                let lower = text.to_lowercase();
                if (lower.contains("bit.ly/") || lower.contains(".csv") || lower.contains("hubspotusercontent"))
                    && seen_links.insert(text.clone())
                {
                    candidates.push(text);
                }
            }
            candidates
        };
'@
          if (-not $backend.Contains($oldBlock)) {
            throw 'The expected TCGplayer HTML parsing block was not found in the restored backend source.'
          }
          $backend = $backend.Replace($oldBlock, $newBlock)
          [IO.File]::WriteAllText($backendPath, $backend, [Text.UTF8Encoding]::new($false))

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SOURCE_DIR }}/src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Generate Windows application icons
        working-directory: ${{ env.SOURCE_DIR }}
        run: npx tauri icon dist/assets/icon.svg

      - name: Validate frontend JavaScript
        working-directory: ${{ env.SOURCE_DIR }}
        shell: pwsh
        run: |
          node --check dist/src/app.js
          node --check dist/src/db.js
          node --check dist/src/native.js
          node --check dist/src/auction.js
          node --check dist/src/csv.js
          node --check dist/src/marketplaces.js
          node --check dist/src/scoring.js

      - name: Run Rust tests
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build CardSignal
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm run build:windows

      - name: Stage artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item "$env:SOURCE_DIR/src-tauri/target/release/cardsignal.exe" release/CardSignal-Portable-v0.5.0.exe
          Get-ChildItem "$env:SOURCE_DIR/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1 | ForEach-Object {
            Copy-Item $_.FullName release/CardSignal-Setup-v0.5.0.exe
          }
          Get-FileHash release/* -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content release/SHA256.txt

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CardSignal-Windows-v0.5.0
          path: release/*
          if-no-files-found: error
          retention-days: 30
