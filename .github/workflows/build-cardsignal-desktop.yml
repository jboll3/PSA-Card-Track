name: Build CardSignal Desktop

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SOURCE_DIR: source/CardSignal-Desktop-v0.5.0-upload
      RELEASE_VERSION: 0.5.2
    steps:
      - name: Check out build bundle
        uses: actions/checkout@v4

      - name: Restore and patch CardSignal source
        shell: pwsh
        run: |
          $parts = Get-ChildItem cardsignal-source.part* | Sort-Object Name
          if (-not $parts) { throw 'CardSignal source parts were not found.' }
          $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
          [IO.File]::WriteAllBytes('cardsignal-source.tar.gz', [Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force -Path source | Out-Null
          tar -xzf cardsignal-source.tar.gz -C source
          if (-not (Test-Path "$env:SOURCE_DIR/package.json")) {
            throw "package.json was not restored at $env:SOURCE_DIR"
          }

          $backendPath = "$env:SOURCE_DIR/src-tauri/src/lib.rs"
          $backend = [IO.File]::ReadAllText($backendPath).Replace("`r`n", "`n")
          $backend = $backend.Replace(
            'use reqwest::header::{ACCEPT, ACCEPT_LANGUAGE, AUTHORIZATION, USER_AGENT};',
            'use reqwest::header::{ACCEPT, ACCEPT_LANGUAGE, AUTHORIZATION};'
          )
          $backend = $backend.Replace('const APP_VERSION: &str = "0.5.0";', 'const APP_VERSION: &str = "0.5.2";')
          $backend = $backend.Replace(
            '        let mut backup = rusqlite::backup::Backup::new(&source, &mut target)?;',
            '        let backup = rusqlite::backup::Backup::new(&source, &mut target)?;'
          )
          $backend = $backend.Replace(
            "async fn ebay_access_token(state: &AppState) -> CsResult<String> {`n    if let Some(cached) = state.ebay_token.lock().clone() {",
            "async fn ebay_access_token(state: &AppState) -> CsResult<String> {`n    let cached_token = { state.ebay_token.lock().clone() };`n    if let Some(cached) = cached_token {"
          )

          $startMarker = '        let document = Html::parse_document(&html);'
          $endMarker = "`n`n        let mut found_for_month = 0usize;"
          $start = $backend.IndexOf($startMarker)
          if ($start -lt 0) { throw 'TCGplayer parser start marker was not found.' }
          $end = $backend.IndexOf($endMarker, $start)
          if ($end -lt 0) { throw 'TCGplayer parser end marker was not found.' }
          $replacement = @(
            '        // scraper::Html is not Send, so it must be dropped before the next await.',
            '        let candidates = {',
            '            let document = Html::parse_document(&html);',
            '            let base = Url::parse(&article_url)?;',
            '            let mut candidates = Vec::<String>::new();',
            '            let mut seen_links = HashSet::<String>::new();',
            '            for anchor in document.select(&href_selector) {',
            '                let Some(href) = anchor.value().attr("href") else { continue; };',
            '                let resolved = Url::parse(href).or_else(|_| base.join(href));',
            '                let Ok(url) = resolved else { continue; };',
            '                let text = url.as_str().to_string();',
            '                let lower = text.to_lowercase();',
            '                if (lower.contains("bit.ly/") || lower.contains(".csv") || lower.contains("hubspotusercontent"))',
            '                    && seen_links.insert(text.clone())',
            '                {',
            '                    candidates.push(text);',
            '                }',
            '            }',
            '            candidates',
            '        };'
          ) -join "`n"
          $backend = $backend.Substring(0, $start) + $replacement + $backend.Substring($end)
          [IO.File]::WriteAllText($backendPath, $backend, [Text.UTF8Encoding]::new($false))

          $mainPath = "$env:SOURCE_DIR/src-tauri/src/main.rs"
          $main = [IO.File]::ReadAllText($mainPath).Replace("`r`n", "`n")
          $attribute = '#![cfg_attr(not(debug_assertions), windows_subsystem = "windows")]'
          if (-not $main.StartsWith($attribute)) {
            $main = $attribute + "`n`n" + $main
          }
          [IO.File]::WriteAllText($mainPath, $main, [Text.UTF8Encoding]::new($false))

          $versionFiles = @(
            "$env:SOURCE_DIR/package.json",
            "$env:SOURCE_DIR/src-tauri/Cargo.toml",
            "$env:SOURCE_DIR/src-tauri/tauri.conf.json",
            "$env:SOURCE_DIR/README.md",
            "$env:SOURCE_DIR/CHANGELOG.md",
            "$env:SOURCE_DIR/dist/index.html",
            "$env:SOURCE_DIR/dist/src/app.js"
          )
          foreach ($file in $versionFiles) {
            if (Test-Path $file) {
              $text = [IO.File]::ReadAllText($file).Replace('0.5.0', '0.5.2')
              [IO.File]::WriteAllText($file, $text, [Text.UTF8Encoding]::new($false))
            }
          }

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "${{ env.SOURCE_DIR }}/src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Generate Windows application icons
        working-directory: ${{ env.SOURCE_DIR }}
        run: npx tauri icon dist/assets/icon.svg

      - name: Validate frontend JavaScript
        working-directory: ${{ env.SOURCE_DIR }}
        shell: pwsh
        run: |
          Get-ChildItem dist/src/*.js | ForEach-Object { node --check $_.FullName }

      - name: Compile and test Rust backend
        working-directory: ${{ env.SOURCE_DIR }}
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Windows application
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm run build:windows

      - name: Stage and verify artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $portable = "$env:SOURCE_DIR/src-tauri/target/release/cardsignal.exe"
          if (-not (Test-Path $portable)) { throw 'Portable executable was not produced.' }
          Copy-Item $portable "release/CardSignal-Portable-v$env:RELEASE_VERSION.exe"
          $installer = Get-ChildItem "$env:SOURCE_DIR/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          Copy-Item $installer.FullName "release/CardSignal-Setup-v$env:RELEASE_VERSION.exe"
          Get-ChildItem release/*.exe | ForEach-Object {
            if ($_.Length -lt 1MB) { throw "Artifact $($_.Name) is unexpectedly small." }
          }
          Get-FileHash release/* -Algorithm SHA256 | Format-Table -AutoSize | Out-String | Set-Content release/SHA256.txt
          Get-ChildItem release | Format-Table Name,Length -AutoSize

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CardSignal-Windows-v0.5.2
          path: release/*
          if-no-files-found: error
          retention-days: 30
