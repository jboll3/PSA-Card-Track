name: Verify CardSignal Updater Release

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    name: Verify signed updater assets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: cardsignal-v0.5.7
      EXPECTED_VERSION: 0.5.7
      RELEASE_TRIGGER_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verify signed release workflow
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          runs_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-cardsignal-desktop.yml/runs?branch=cardsignal-desktop&event=push&per_page=30"
          for attempt in $(seq 1 60); do
            curl -sS -L \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -o release-runs.json "$runs_api"
            run=$(jq -c --arg sha "$RELEASE_TRIGGER_SHA" '[.workflow_runs[] | select(.head_sha == $sha)][0] // null' release-runs.json)
            if [[ "$run" != "null" ]]; then
              status=$(jq -r '.status' <<<"$run")
              conclusion=$(jq -r '.conclusion // ""' <<<"$run")
              run_id=$(jq -r '.id' <<<"$run")
              echo "Release workflow ${run_id}: status=${status} conclusion=${conclusion}"
              if [[ "$status" == "completed" ]]; then
                curl -sS -L \
                  -H 'Accept: application/vnd.github+json' \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H 'X-GitHub-Api-Version: 2022-11-28' \
                  -o release-jobs.json \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs"
                if [[ "$conclusion" == "success" ]]; then
                  exit 0
                fi
                echo 'Signed release workflow failed:' >&2
                jq '.jobs[] | {name, status, conclusion, steps}' release-jobs.json >&2
                exit 1
              fi
            else
              echo "Release workflow run not visible yet (attempt ${attempt}/60)."
            fi
            sleep 15
          done
          echo 'Signed release workflow did not complete in the verification window.' >&2
          exit 1

      - name: Wait for signed release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}"
          for attempt in $(seq 1 20); do
            code=$(curl -sS -L -o release.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")
            if [[ "$code" == "200" ]]; then
              names=$(jq -r '.assets[].name' release.json)
              if grep -qx 'latest.json' <<<"$names" \
                && grep -Eq '\.sig$' <<<"$names" \
                && grep -Eq '\.(exe|zip)$' <<<"$names"; then
                echo "Signed CardSignal release is complete:"
                printf '%s\n' "$names"
                exit 0
              fi
            fi
            echo "Release not complete yet (attempt ${attempt}/20, HTTP ${code})."
            sleep 15
          done
          echo 'Signed updater release did not become complete.' >&2
          [[ -f release.json ]] && cat release.json >&2
          exit 1

      - name: Validate latest.json
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          latest_url=$(jq -r '.assets[] | select(.name == "latest.json") | .browser_download_url' release.json)
          curl -sS -L \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -o latest.json "$latest_url"
          jq -e --arg version "$EXPECTED_VERSION" '.version == $version' latest.json
          jq -e '.platforms | length > 0' latest.json
          jq -e '[.platforms[].signature | length > 0] | all' latest.json
          jq -e '[.platforms[].url | length > 0] | all' latest.json
          cat latest.json

      - name: Upload verification record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CardSignal-v0.5.7-release-verification
          path: |
            release-runs.json
            release-jobs.json
            release.json
            latest.json
          if-no-files-found: warn
          retention-days: 30
