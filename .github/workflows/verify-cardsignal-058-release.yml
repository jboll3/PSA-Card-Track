name: Verify CardSignal 0.5.8 Release

on:
  push:
    branches:
      - verify-cardsignal-v0.5.8

permissions:
  contents: write

jobs:
  verify:
    name: Verify signed updater assets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Verify release and write receipt
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag='cardsignal-v0.5.8'
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${tag}"
          for attempt in $(seq 1 40); do
            code=$(curl -sS -L -o release.json -w '%{http_code}' \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "$api")
            if [[ "$code" == '200' ]]; then
              names=$(jq -r '.assets[].name' release.json)
              if grep -qx 'latest.json' <<<"$names" \
                && grep -qx 'CardSignal_0.5.8_x64-setup.exe' <<<"$names" \
                && grep -qx 'CardSignal_0.5.8_x64-setup.exe.sig' <<<"$names"; then
                break
              fi
            fi
            if [[ "$attempt" == '40' ]]; then
              echo 'Complete 0.5.8 updater assets did not appear.' >&2
              [[ -f release.json ]] && cat release.json >&2
              exit 1
            fi
            sleep 15
          done

          latest_url=$(jq -r '.assets[] | select(.name == "latest.json") | .browser_download_url' release.json)
          curl -sS -L -H "Authorization: Bearer ${GH_TOKEN}" -o latest.json "$latest_url"
          jq -e '.version == "0.5.8"' latest.json
          jq -e '.platforms | length > 0' latest.json
          jq -e '[.platforms[].signature | length > 0] | all' latest.json
          jq -e '[.platforms[].url | contains("CardSignal_0.5.8_x64-setup.exe")] | all' latest.json

          published=$(jq -r '.published_at' release.json)
          jq -n --arg published "$published" '{
            version: "0.5.8",
            tag: "cardsignal-v0.5.8",
            verified: true,
            publishedAt: $published,
            assets: [
              "CardSignal_0.5.8_x64-setup.exe",
              "CardSignal_0.5.8_x64-setup.exe.sig",
              "latest.json"
            ]
          }' > receipt.json
          encoded=$(base64 -w 0 receipt.json)
          jq -n --arg message 'Record verified CardSignal 0.5.8 updater release' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}' > payload.json
          curl -sS -L --fail-with-body -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d @payload.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/release-verification-v0.5.8.json"
