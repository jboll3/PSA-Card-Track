name: Inspect CardSignal 0.5.8 Release

on:
  push:
    branches:
      - inspect-cardsignal-v0.5.8

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    name: Inspect release workflow
    runs-on: ubuntu-latest
    steps:
      - name: Record release workflow state
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release-cardsignal-desktop.yml/runs?branch=release-cardsignal-v0.5.8&event=push&per_page=10"
          curl -sS -L --fail-with-body \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -o runs.json "$api"
          jq '{workflow_runs: [.workflow_runs[] | {id, status, conclusion, head_sha, run_number, created_at, updated_at, jobs_url}]}' runs.json > receipt.json
          encoded=$(base64 -w 0 receipt.json)
          jq -n --arg message 'Record CardSignal 0.5.8 release workflow state' --arg content "$encoded" '{message:$message,content:$content,branch:"main"}' > payload.json
          curl -sS -L --fail-with-body -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            -d @payload.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/contents/release-workflow-state-v0.5.8.json"
