name: Bootstrap CardSignal Updater Key

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keypair:
    name: Generate updater keypair
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      SOURCE_DIR: source/CardSignal-Desktop-v0.5.0-upload
    steps:
      - name: Check out build bundle
        uses: actions/checkout@v4

      - name: Restore CardSignal source
        shell: pwsh
        run: |
          $parts = Get-ChildItem cardsignal-source.part* | Sort-Object Name
          if (-not $parts) { throw 'CardSignal source parts were not found.' }
          $encoded = ($parts | ForEach-Object { [IO.File]::ReadAllText($_.FullName) }) -join ''
          [IO.File]::WriteAllBytes('cardsignal-source.tar.gz', [Convert]::FromBase64String($encoded))
          New-Item -ItemType Directory -Force -Path source | Out-Null
          tar -xzf cardsignal-source.tar.gz -C source

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Tauri CLI
        working-directory: ${{ env.SOURCE_DIR }}
        run: npm install

      - name: Generate permanent updater keypair
        working-directory: ${{ env.SOURCE_DIR }}
        shell: pwsh
        run: npx tauri signer generate -w cardsignal-updater.key --ci

      - name: Upload private key
        uses: actions/upload-artifact@v4
        with:
          name: CardSignal-Updater-Private-Key
          path: ${{ env.SOURCE_DIR }}/cardsignal-updater.key
          if-no-files-found: error
          retention-days: 90

      - name: Upload public key
        uses: actions/upload-artifact@v4
        with:
          name: CardSignal-Updater-Public-Key
          path: ${{ env.SOURCE_DIR }}/cardsignal-updater.key.pub
          if-no-files-found: error
          retention-days: 90
